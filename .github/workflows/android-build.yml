name: Android build check
on:
  push:
    paths:
      - 'gotuj-i-mroz/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gotuj-i-mroz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gotuj-i-mroz/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub Ubuntu runners already provide Android SDK; the setup action
      # currently fails while requesting the removed legacy SDK 'tools' package.
      - name: Install dependencies
        run: npm ci
      - name: Test game
        run: npm test
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build unsigned debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: gotuj-i-mroz/android
