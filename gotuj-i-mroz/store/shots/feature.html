<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Feature</title>
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
.bg{position:relative;width:1024px;height:500px;background:
 radial-gradient(circle at 78% 30%,rgba(255,214,140,.55),rgba(255,214,140,0) 45%),
 linear-gradient(135deg,#8f3d2d,#5c1f1a 70%);overflow:hidden}
.bricks{position:absolute;inset:0;background:
 repeating-linear-gradient(0deg,rgba(255,225,190,.10) 0 2px,transparent 2px 34px)}
.counter{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(#f4e7d0 0 22px,#835030 22px,#4a2a17);border-top:3px solid #d9a441}
.t{position:absolute;left:56px;top:70px;color:#fff3d6}
.t h1{margin:0;font-size:86px;line-height:1;text-shadow:0 5px 0 #3a120d;letter-spacing:1px}
.t h1 span{color:#ffd25e}
.t p{margin:14px 0 0;font:700 30px system-ui,"Segoe UI",sans-serif;color:#ffe9c4}
.chips{position:absolute;left:58px;top:288px;display:flex;gap:12px;font:800 22px system-ui,"Segoe UI",sans-serif}
.chips span{background:#ffd25e;color:#3a1a10;border-radius:999px;padding:8px 18px;box-shadow:0 3px 0 #b8841c}
.chef{position:absolute;right:36px;top:60px;font-size:180px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.dish{position:absolute;font-size:76px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.28))}
.snow{position:absolute;right:210px;top:14px;font-size:70px;opacity:.9}
</style></head>
<body><div class="bg"><div class="bricks"></div>
<div class="t"><h1>Gotuj <span>i</span> Mroź</h1><p>Prowadź własną restaurację!</p></div>
<div class="chips"><span>72 przepisy</span><span>Własne dania</span><span>Klienci płacą</span></div>
<div class="chef">👩‍🍳</div><div class="snow">❄️</div>
<div class="counter"></div>
<div class="dish" style="left:612px;top:340px">🍲</div>
<div class="dish" style="left:694px;top:350px">🍕</div>
<div class="dish" style="left:776px;top:340px">🍧</div>
<div class="dish" style="left:858px;top:350px">🥞</div>
<div class="dish" style="left:930px;top:340px">🍰</div>
</div></body></html>
