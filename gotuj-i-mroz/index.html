<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1712">
<title>Gotuj i Mroź</title>
<style>
:root{--bg:#2a1712;--panel:#3a2219;--cream:#fbf0dc;--accent:#f0762d;--gold:#ffd25e;--ink:#2b1a12;--ok:#3cb371;--bad:#e5484d;--shadow:0 2px 0 rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{height:100vh;height:100dvh;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  display:grid;gap:6px;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1.05fr) minmax(0,.95fr) auto;
  grid-template-areas:"hud" "cust" "stat" "side"}
@media (orientation:landscape){
  #app{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1.32fr) minmax(0,.82fr);
    grid-template-areas:"hud hud" "cust side" "stat side"}
}
/* HUD */
#hud{grid-area:hud;display:flex;align-items:center;gap:7px;background:linear-gradient(#6b2a20,#4d1c15);color:#fff;border-radius:12px;padding:4px 8px;font-weight:800;box-shadow:var(--shadow);border:1px solid #8a3b2c}
.chef{display:flex;align-items:center;gap:6px;min-width:0}
.avatar{width:38px;height:38px;border-radius:50%;background:#fff3d6;border:2px solid var(--gold);font-size:23px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.avatar .mood{position:absolute;right:-7px;bottom:-7px;font-size:15px}
.chef b{display:block;font-size:12px;line-height:1.05;white-space:nowrap}
.chef small{display:block;font-size:10px;opacity:.85;white-space:nowrap;font-weight:700}
.pill{background:rgba(0,0,0,.3);border-radius:999px;padding:3px 9px;white-space:nowrap;font-size:13px}
#coins{color:var(--gold)}
#rep{color:#ffd25e}
#combo{background:#c2410c;display:none}
.goal{flex:1;min-width:50px}
.goal .gb{height:8px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:2px}
.goal .gb i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ffd25e);width:0}
.goal small{font-size:10px;opacity:.95;font-weight:700}
.ibtn{background:rgba(255,255,255,.15);border:0;border-radius:10px;width:34px;height:32px;font-size:16px;cursor:pointer;flex:none}
@media (max-width:640px){.chef div{display:none}.pill.hidesm{display:none}}
/* scena */
#cust{grid-area:cust;position:relative;min-height:0;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:2px solid #5a3727;background:#6e2a20}
#scene{position:absolute;left:0;top:0;display:block}
/* kuchnia */
#stat{grid-area:stat;display:flex;gap:5px;min-height:0;background:linear-gradient(#4a4f55,#33383d);border-radius:12px;padding:5px;border:2px solid #20252a}
.st{flex:1;min-width:0;border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;cursor:pointer;
  background:linear-gradient(#f1f4f6,#bcc6ce);border:3px solid #8b97a0;overflow:hidden}
.st.oven{background:linear-gradient(#f6e6d6,#d2a98a);border-color:#a8744f}
.st.frz{background:linear-gradient(#eaf7ff,#a9d4ee);border-color:#6fb4e0}
.st.cooking{border-color:#ff7a2f}
.st.frz.cooking{border-color:#3aa3ff}
.st.done{border-color:var(--ok);animation:pulse .7s infinite alternate}
.st.burnt{border-color:var(--bad);background:linear-gradient(#ffe1e1,#e8a6a6)}
.st.target{outline:4px solid var(--gold);outline-offset:-1px;animation:glow2 .9s infinite alternate}
@keyframes pulse{to{transform:scale(1.03)}}
@keyframes glow2{to{outline-color:rgba(255,210,94,.35)}}
.st .nm{font-weight:900;font-size:clamp(8px,1.55vh,13px);padding:0 15px;line-height:1.1;text-align:center;white-space:nowrap}
.st .big{line-height:1;width:100%;display:flex;justify-content:center;align-items:center}
.st .big svg{width:100%;height:clamp(34px,10.5vh,66px)}
.bigE{font-size:clamp(28px,8vh,48px)}
.st .what{font-size:9px;opacity:.65;text-align:center;line-height:1.05;min-height:10px}
@media (max-height:520px){.st .what{display:none}}
.app .steam path{stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;opacity:.85;animation:steam 1.3s infinite}
.app .steam path:nth-child(2){animation-delay:.3s}.app .steam path:nth-child(3){animation-delay:.6s}
@keyframes steam{0%{transform:translateY(4px);opacity:0}50%{opacity:.9}100%{transform:translateY(-6px);opacity:0}}
.app .fl path{fill:#ff7a2f;animation:fl .35s infinite alternate;transform-box:fill-box;transform-origin:bottom}
@keyframes fl{to{transform:scaleY(1.35);fill:#ffc247}}
.app .lid{transform-box:fill-box;transform-origin:50% 100%;animation:lidw .35s infinite alternate}
@keyframes lidw{to{transform:translateY(-1.6px) rotate(-1.5deg)}}
.app .sz circle{fill:#fff7cf;animation:sz .5s infinite alternate}
@keyframes sz{to{transform:translateY(-3px);opacity:.4}}
.app .heat path{stroke:#fff1c4;stroke-width:1.6;opacity:.8;animation:heat 1s infinite alternate}
@keyframes heat{to{opacity:.2}}
.app .mw{animation:mw 1.6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes mw{to{transform:rotate(360deg)}}
.app .ice path{stroke:#4aa8ff;stroke-width:2;fill:none;stroke-linecap:round;animation:ice 1s infinite alternate}
@keyframes ice{to{opacity:.3}}
.st.cooking .big{animation:wob .5s infinite alternate}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.st .slots{display:flex;gap:1px;min-height:20px;font-size:clamp(14px,3.2vh,22px);justify-content:center;flex-wrap:wrap;line-height:1.1}
.st .msg{font-size:clamp(9px,1.7vh,12px);font-weight:700;text-align:center;line-height:1.1}
.st .clr{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.15);border-radius:50%;width:20px;height:20px;font-size:10px;cursor:pointer;line-height:1;padding:0}
.st .go{background:var(--accent);color:#fff;border:0;border-radius:8px;font-weight:900;font-size:12px;padding:4px 8px;box-shadow:0 2px 0 #b04a12;cursor:pointer}
.bar{height:7px;width:100%;background:rgba(0,0,0,.18);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
/* prawa kolumna */
#side{grid-area:side;display:flex;flex-direction:column;gap:5px;min-height:0}
#recipe{background:var(--cream);border:2px solid var(--gold);border-radius:12px;box-shadow:var(--shadow);padding:5px 8px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.rc-head{display:flex;align-items:center;gap:8px}
.rc-e{font-size:26px;line-height:1}
.rc-head b{display:block;font-size:13px;line-height:1.1}
.rc-head small{font-size:10px;opacity:.75}
.rc-st{margin-left:auto;background:#3a2219;color:#fff;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.rc-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chip{position:relative;width:38px;height:38px;border-radius:10px;border:2px solid #e3c79a;background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer}
.chip i{position:absolute;right:-4px;bottom:-6px;background:var(--ink);color:#fff;border-radius:999px;min-width:16px;height:16px;font-size:10px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px}
.chip.done{background:#d8f3e2;border-color:var(--ok);cursor:default}
.chip.done i{background:var(--ok)}
.chip.held{border-color:var(--accent);background:#ffe1bd}
.rc-plus{font-weight:900;opacity:.5}
.rc-arrow{font-weight:900;font-size:16px;margin:0 2px}
.rc-dish{font-size:24px}
.rc-hint{font-size:11px;font-weight:800;background:#fff0c9;border-radius:8px;padding:3px 7px;line-height:1.2}
#handbar{display:flex;gap:5px;align-items:center}
#hand{flex:1;background:var(--cream);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:3px 10px;font-weight:800;min-height:32px;display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.1}
#hand .he{font-size:20px}
#bin{background:#e7b4a8;border:0;border-radius:12px;box-shadow:var(--shadow);width:44px;min-height:32px;font-size:17px;cursor:pointer}
#tabs{display:flex;gap:3px}
.tab{flex:1;border:0;border-radius:10px 10px 0 0;background:#5a3727;color:#fbe9cf;padding:5px 1px;font-weight:800;font-size:10px;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden}
.tab .ti{font-size:16px}
.tab.on{background:#8a5a37;color:#fff}
.tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5a3c;margin-left:3px;vertical-align:middle}
@media (max-width:900px){.tab .tl{display:none}}
#tray{background:linear-gradient(#8a5a37,#6b4428);border-radius:0 0 12px 12px;box-shadow:var(--shadow);padding:8px 6px 6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;align-content:start;overflow:auto;min-height:0;flex:1;border:2px solid #4a2d19}
@media (orientation:portrait){#tray{flex:none;max-height:26vh}}
.tile{position:relative;border:2px solid #e3c79a;background:var(--cream);border-radius:12px;padding:3px 2px 2px;text-align:center;cursor:pointer;min-height:54px;color:var(--ink)}
.tile.held{border-color:var(--accent);background:#ffe1bd;transform:translateY(-2px)}
.tile.out{opacity:.8;background:#e3dccf}
.tile.need{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,94,.7);animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 5px rgba(255,210,94,.25)}}
.tile .te{font-size:22px;line-height:1.1}
.tile .tn{font-size:9px;font-weight:700;line-height:1}
.tile .badge{position:absolute;top:-6px;left:-4px;background:var(--ink);color:#fff;border-radius:999px;min-width:19px;height:19px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tile .plus{position:absolute;top:-6px;right:-4px;background:var(--ok);color:#fff;border:0;border-radius:999px;height:19px;font-size:9px;font-weight:800;padding:0 5px;cursor:pointer}
#toast{position:fixed;left:50%;top:52px;transform:translateX(-50%);background:rgba(20,10,5,.92);color:#fff;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90vw;text-align:center;z-index:5}
#toast.on{opacity:1}
/* okna */
#ov{position:fixed;inset:0;background:rgba(20,10,5,.72);display:none;align-items:center;justify-content:center;padding:10px;z-index:10}
#ov.on{display:flex}
#ovbox{background:var(--cream);border-radius:18px;padding:14px 16px;max-width:600px;width:100%;max-height:94vh;overflow:auto;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);border:3px solid var(--gold);animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#ovbox h1{margin:0 0 2px;font-size:28px;color:#8a2c1b}
#ovbox h2{margin:0 0 6px;font-size:20px}
#ovbox p{margin:6px 0;font-size:14px;line-height:1.35}
.sub{font-size:12px;opacity:.8;margin:0 0 8px}
.bigbtn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:11px 24px;font-size:17px;font-weight:900;margin:6px 4px 0;box-shadow:0 3px 0 #b04a12;cursor:pointer}
.bigbtn.alt{background:#6b4428;box-shadow:0 3px 0 #3d2616}
.bigbtn.sm{padding:6px 12px;font-size:13px;margin:0}
.rec{display:flex;align-items:center;gap:8px;text-align:left;border-bottom:1px dashed #d9c3a0;padding:4px 0;font-size:13px}
.rec .re{font-size:24px}
.rec b{display:block}
.rec .ri{font-size:16px;letter-spacing:1px}
.rec small{opacity:.75}
.rec .rp{margin-left:auto;font-weight:900;color:#2e8b57;white-space:nowrap}
.rec.lock{opacity:.5}
.stars{font-size:32px;letter-spacing:4px}
.btabs{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap;justify-content:center}
.btab{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:#e3c79a;cursor:pointer}
.btab.on{background:var(--accent);color:#fff}
.review{background:#fff;border-radius:10px;padding:6px 10px;margin:5px 0;text-align:left;font-size:13px;font-style:italic;border-left:4px solid var(--gold)}
.review small{display:block;font-style:normal;opacity:.7}
.newr{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:4px 0}
.newr span{background:#fff;border:1px solid #e3c79a;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}
.stats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.stats div{background:#fff;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700}
.stats b{display:block;font-size:17px}
#wash{background:#cfe9ff;border:0;border-radius:12px;box-shadow:var(--shadow);width:44px;min-height:32px;font-size:17px;cursor:pointer}
#wash.dirty{background:#ff9d8a;animation:pulse .5s infinite alternate}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e3c79a;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:15px;font-weight:700;cursor:pointer}
.opt.ok{background:#d8f3e2;border-color:#3cb371}
.opt.bad{background:#ffd9d9;border-color:#e5484d}
.lcard{background:#fff;border-left:5px solid var(--gold);border-radius:12px;padding:14px;font-size:16px;line-height:1.45;text-align:left;margin:8px 0}
.lesson{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:2px solid #e3c79a;border-radius:12px;padding:8px 10px;margin:5px 0;text-align:left;cursor:pointer}
.lesson b{display:block}
.lesson small{display:block;opacity:.7}
.lesson .re{font-size:24px}
.lesson .rp{margin-left:auto;font-weight:900;color:#2e8b57}
.expl{background:#fff0c9;border-radius:10px;padding:8px 10px;font-size:14px;text-align:left}
.nav{display:flex;gap:8px;justify-content:center}
.how{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:4px;margin:10px 0}
.how .hs{background:#fff;border:2px solid #e3c79a;border-radius:14px;padding:6px 6px 4px;width:92px;position:relative}
.how .hs i{position:absolute;left:-6px;top:-8px;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;font-style:normal;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #b04a12}
.how .hs b{display:block;font-size:30px;line-height:1.1}
.how .hs small{display:block;font-size:11px;font-weight:700;line-height:1.15;margin-top:2px}
.how .ar{align-self:center;font-weight:900;font-size:18px;opacity:.5}
.howtips{text-align:left;font-size:13px;font-weight:700;margin:6px 0}
.howtips div{background:#fff0c9;border-radius:10px;padding:5px 9px;margin:4px 0}
.gbtn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:8px 16px;font-weight:900;font-size:15px;box-shadow:0 3px 0 #b04a12;cursor:pointer;align-self:flex-start}
.gskip{background:transparent;border:0;color:#8a6a55;font-size:11px;text-decoration:underline;cursor:pointer;align-self:flex-end;padding:0}
.chap{margin:10px 0 4px;text-align:left;font-size:13px}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv{background:#fff;border:2px solid #e3c79a;border-radius:10px;padding:6px 2px;cursor:pointer;font-size:15px;line-height:1.1}
.lv b{display:block}
.lv small{font-size:10px;color:#e0a100;letter-spacing:1px}
.lv.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,118,45,.35)}
.lv.lock{opacity:.45;cursor:default}
#stat,#tray,#recipe,#cust{position:relative}
#cust::before,#stat::before{position:absolute;z-index:4;left:10px;background:rgba(40,20,10,.9);color:#ffe9c4;font-size:10px;font-weight:800;letter-spacing:.4px;padding:2px 8px;pointer-events:none;white-space:nowrap}
#cust::before{content:"🚪 RESTAURACJA · klienci przy ladzie";bottom:0;border-radius:8px 8px 0 0}
#stat::before{content:"🔥 KUCHNIA · urządzenia";top:-13px;border-radius:8px 8px 0 0}
@media (max-width:640px){#cust::before,#stat::before{font-size:9px}}
.coach{position:relative;z-index:50;box-shadow:0 0 0 100vmax rgba(15,8,4,.7),0 0 0 4px var(--gold)!important;border-radius:12px;animation:coachp 1s infinite alternate}
@keyframes coachp{to{box-shadow:0 0 0 100vmax rgba(15,8,4,.7),0 0 0 8px rgba(255,210,94,.5)!important}}
#coach{position:fixed;left:50%;transform:translateX(-50%);z-index:60;max-width:min(560px,94vw);width:94%;background:var(--cream);border:3px solid var(--gold);border-radius:16px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.55);display:none;color:var(--ink)}
#coach.on{display:block}
#coach p{margin:0 0 8px;font-size:15px;font-weight:700;line-height:1.35}
#coach .cb{display:flex;gap:8px;justify-content:space-between;align-items:center}
#coach .cs{font-size:12px;opacity:.7}
#coach button{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:8px 16px;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #b04a12}
#coach button.skip{background:#8a6a55;box-shadow:0 3px 0 #5a4030;font-size:12px;padding:6px 10px}
#hhand{position:fixed;left:0;top:0;font-size:38px;line-height:1;pointer-events:none;z-index:40;display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.st.micro{background:linear-gradient(#e8ecf3,#b3bccd);border-color:#6f7f9c}
.fly{position:fixed;left:0;top:0;font-size:30px;line-height:1;pointer-events:none;z-index:45;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.coinfx{position:fixed;left:0;top:0;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc21a 55%,#c98a00);border:1.5px solid #8a5d00;pointer-events:none;z-index:46;box-shadow:0 0 8px rgba(255,210,94,.9)}
.cf{position:fixed;top:-20px;width:9px;height:14px;pointer-events:none;z-index:80;border-radius:2px}
#app.shake{animation:shk .35s}
@keyframes shk{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}
#evt{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:8;display:none;background:linear-gradient(#ff9d3c,#e2531f);color:#fff;font-weight:900;font-size:14px;padding:6px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.4);border:2px solid #ffe08a;pointer-events:none;white-space:nowrap}
#evt.on{display:block;animation:evtp .8s infinite alternate}
@keyframes evtp{to{transform:translateX(-50%) scale(1.05)}}
#mission{display:block;font-size:10px;font-weight:700;opacity:.95;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:active,.tile:active,.chip:active{transform:scale(.94)}
.st:active{transform:scale(.97)}
.st.dim{opacity:.5;filter:saturate(.5)}
.tile.dimmed{opacity:.55}
.rc-hint b{color:#b04a12}
.st.drop{transform:scale(1.05);box-shadow:0 0 0 5px var(--gold),0 0 18px rgba(255,210,94,.9)}
#ghost{position:fixed;left:0;top:0;pointer-events:none;font-size:46px;line-height:1;transform:translate(-50%,-70%) rotate(-8deg);z-index:30;display:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
body.dragging,body.dragging *{cursor:grabbing!important}
.tile,.chip{cursor:grab}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chef"><div class="avatar">👩‍🍳<span class="mood" id="mood">😊</span></div><div><b id="title">Kucharz</b><small id="day">Poziom 1</small></div></div>
    <span class="pill" id="coins">0 zł</span>
    <span class="pill" id="rep">★ 3.0</span>
    <span class="pill" id="combo">🔥</span>
    <span class="pill" id="time">⏱ 90s</span>

let AC=null;
function tone(f,d,type,v,when,chan){
  if(!(chan==="m"?S.music:S.sound))return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;
    o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime+(when||0);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t);o.stop(t+d);
  }catch(e){}
}
const beep=(f,d=.12,type="sine",v=.12,when=0)=>tone(f,d,type,v,when,"s");
function noiseBurst(dur,vol){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=AC.createBufferSource();src.buffer=buf;
    const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.value=2500;
    const g2=AC.createGain();g2.gain.value=vol;
    src.connect(hp);hp.connect(g2);g2.connect(AC.destination);src.start();
  }catch(e){}
}

function act(d){
  if(!S.running&&d.act!=="book"&&d.act!=="sound"&&d.act!=="music")return;
  switch(d.act){
    case "tab": S.tab=d.id;dirty=true;break;
    case "sound": S.sound=!S.sound;save();dirty=true;break;
    case "music": S.music=!S.music;save();dirty=true;break;
    case "book": showBook();break;
    case "buy": {
      const i=ING[d.id];
      if(S.coins<i.p){say("Za mało pieniędzy 💸");sfx.bad();break;}
      S.coins-=i.p;S.stock[d.id]=(S.stock[d.id]||0)+1;sfx.buy();dirty=true;break;
    }
    case "ing": {
      const id=d.id;
      if(S.hand&&S.hand.t==="dish"){say("Ręce zajęte potrawą! Podaj ją klientowi 🍽️");sfx.bad();break;}
      if(hyg()&&S.dirty&&!isRaw(id)){say("🧼 Najpierw umyj ręce po surowym mięsie, rybach lub jajkach! (higiena, HACCP)");sfx.bad();break;}
      if(S.hand&&S.hand.t==="ing"){
        S.stock[S.hand.id]++;
        if(S.hand.id===id){S.hand=null;sfx.put();dirty=true;break;}
        S.hand=null;
      }
      if((S.stock[id]||0)<=0){
        if(S.coins<ING[id].p){say("Brak "+ING[id].n.toLowerCase()+" i brak pieniędzy 💸");sfx.bad();break;}
        S.coins-=ING[id].p;sfx.buy();
      }else S.stock[id]--;
      S.hand={t:"ing",id};sfx.take();dirty=true;
      if(isRaw(id)&&hyg()&&!S.dirty){S.dirty=true;say("⚠️ Surowy produkt! Po jego użyciu umyj ręce 🧼");}
      break;
    }
    case "wash": {
      if(S.hand&&S.hand.t==="ing"&&isRaw(S.hand.id)){say("Najpierw wrzuć surowy składnik do urządzenia 🍳");break;}
      if(!S.dirty){say("Ręce są już czyste 🧼");break;}
      S.dirty=false;say("🧼 Ręce umyte! Zawsze 20–30 sekund z mydłem.");sfx.put();dirty=true;break;
    }
    case "bin": {
      if(!S.hand){say("Nic nie trzymasz");break;}
      if(S.hand.t==="ing"){S.stock[S.hand.id]++;say("Odłożone do spiżarni");}
      else{say("Potrawa wyrzucona 🗑️");S.combo=0;}
      S.hand=null;sfx.put();dirty=true;break;
    }
    case "clear": {
      const st=S.st[+d.i];
      if(st.items.length||st.state!=="idle"){resetSt(st);say("Wyczyszczone");sfx.put();dirty=true;}
      break;
    }
    case "cook": {
      const st=S.st[+d.i];
      if(st.state!=="idle"||st.items.length<2)break;
      const m=findRecipe(st.type,st.items);
      if(m){startCook(st,dishOf(m),m.time);say(m.e+" "+m.name+": "+STN.find(s=>s.type===st.type).doing.toLowerCase()+"!");}
      else{const cd=customDish(st.type,st.items);startCook(st,cd,5);say("👩‍🍳 Własne danie: "+cd.name);}
      sfx.put();break;
    }
    case "station": stationTap(+d.i);break;
  }
}
function stationTap(i){
  const st=S.st[i],def=STN[i];
  if(!S.hand){
    if(st.state==="done"){
      if(hyg()&&S.dirty){say("🧼 Umyj ręce, zanim weźmiesz gotowe danie! (zanieczyszczenie krzyżowe)");sfx.bad();return;}
      const q=quality(st);S.hand={t:"dish",dish:st.dish,q};resetSt(st);sfx.take();dirty=true;haptic(15);

    else if(st.state==="cooking")say(def.doing+"… jeszcze "+Math.max(1,Math.ceil(st.time-st.t))+" s");
    else say("Weź składnik ze spiżarni i wrzuć tutaj");
    return;
  }

  if(st.state!=="idle"){say(def.name+" jest zajęta");sfx.bad();return;}
  if(st.items.length>=4){say("Pełno! Dotknij "+def.btn+" albo ✖");sfx.bad();return;}
  const _id=S.hand.id;st.items.push(_id);S.hand=null;sfx.put();dirty=true;placeFx(_id,i,def);
  const m=findRecipe(st.type,st.items),longer=hasLonger(st.type,st.items);

  else if(m)say("To "+m.name+"! Dotknij "+def.btn+" albo dodaj składnik");

}
function custTap(i){
  const c=S.q[i];if(!c)return;
  if(!S.hand||S.hand.t!=="dish"){
    S.focusC=c;dirty=true;sfx.put();
    say("Klient chce: "+c.orders.map(o=>o.got?"✅":oLabel(o)).join(" + "));return;
  }
  const d=S.hand.dish,q=S.hand.q;
  if(S.learn&&c.allergy&&dishHas(c.allergy,d.ing)){
    S.hand=null;S.incidents++;S.combo=0;S.rep=Math.max(0,S.rep-.5);
    S.pops.push({x:c.x,t:0,txt:"🚨 Alergen!",col:"#ffb4a8"});
    say("🚨 Gość uczulony na "+AL[c.allergy].n+"! Danie zawierało "+AL[c.allergy].e+". W UE oznacza się 14 alergenów.");
    sfx.burn();haptic(60);dirty=true;leave(i,false);return;
  }
  const oi=c.orders.findIndex(o=>!o.got&&orderMatches(o,d));
  if(oi<0){say("To nie to zamówienie! 🙅");c.p=Math.max(0,c.p-3);S.combo=0;sfx.bad();return;}
  const o=c.orders[oi],pf=Math.max(0,c.p)/c.max;
  const fifo=S.learn&&i>0&&S.q.slice(0,i).some(x=>!x.orders.every(z=>z.got));
  if(fifo)S.rep=Math.max(0,S.rep-.03);
  let mult=q.m,note="";
  if(c.type==="critic"&&q.k<3){mult*=.5;note=" (krytyk: mogło być lepiej)";}
  if(c.type==="vip"){mult*=1.8;}
  const comb=1+Math.min(.5,S.combo*.1);
  const tip=Math.round(pf*4*(1+(S.rep-3)*.1));
  const pay=Math.round((d.base+(o.k==="free"?5:0))*mult*comb*(S.event&&S.event.type==="happy"?1.5:1))+tip;
  o.got=true;c.lastDish=d.e;S.coins+=pay;S.earned+=pay;S.hand=null;
  if(q.k===3){S.combo++;S.stat.ideal++;}else{S.combo=0;if(q.k===2)S.stat.good++;else S.stat.late++;}
  S.rep=Math.max(0,Math.min(5,S.rep+(pf>.5?.05:.02)+(q.k===3?.04:0)-(q.k===1?.03:0)-(note?.05:0)));
  S.pops.push({x:c.x,t:0,txt:"+"+pay+" zł",col:"#ffd25e"});
  if(q.k===3)S.pops.push({x:c.x-12,t:-.25,txt:"⭐ Idealne!",col:"#fff"});
  S.pops.push({x:c.x+14,t:-.45,txt:pf>.6?"😍":pf>.3?"🙂":"😅",col:"#fff"});
  say("+"+pay+" zł · "+q.l+(c.type==="vip"?" · VIP 👑":"")+note+(S.combo>=2?" · seria x"+S.combo+" 🔥":"")+(fifo?" · ℹ️ W gastronomii obsługujemy według kolejki":""));
  sfx.coin();haptic(20);dirty=true;rewardFx(c,d,q,pay);
  if(c.orders.every(x=>x.got)){S.served++;leave(i,true);}
}

const slotX=k=>QW-SW*.62-k*SW;
function tick(dt){
  if(!S.running)return;
  if(S.time>0&&!S.guide)S.time-=dt;
  eventTick(dt);
  if(S.time>0){
    S.spawn-=dt;
    if(S.spawn<=0){
      if(S.q.length<maxQ()){S.q.push(makeCust());sfx.door();dirty=true;}
      S.spawn=(Math.max(6,16-S.day*.2)+Math.random()*4)/(1+(S.rep-3)*.08)*(S.easy?1.3:1)*(S.event&&S.event.type==="rush"?.5:1);
    }
  }
  for(let i=S.q.length-1;i>=0;i--){
    const c=S.q[i];c.p-=dt;
    if(c.p<=0){
      S.lost++;S.combo=0;S.rep=Math.max(0,S.rep-.2);
      S.pops.push({x:c.x,t:0,txt:"😠 bez zapłaty",col:"#ffb4a8"});
      leave(i,false);say("Klient wyszedł niezadowolony 😠 — nie zapłacił");sfx.bad();
    }
  }
  S.q.forEach((c,k)=>{
    const d=slotX(k)-c.x,sp=W*.38*dt;
    if(Math.abs(d)>sp){c.x+=Math.sign(d)*sp;c.walk=true;c.phase+=dt*13;}else{c.x=slotX(k);c.walk=false;}
  });
  S.fx.forEach(f=>f.t+=dt);S.fx=S.fx.filter(f=>f.t<.7);
  S.dine.forEach(d=>{
    if(d.state==="walk"){
      const dx=d.tx-d.cx,dy=d.ty-d.cy,sp=W*.3*dt,dist=Math.hypot(dx,dy);
      if(dist>sp){d.cx+=dx/dist*sp;d.cy+=dy/dist*sp;d.c.phase+=dt*13;}else{d.cx=d.tx;d.cy=d.ty;d.state="eat";d.t=0;}
    }else if(d.state==="eat"){d.t+=dt;if(d.t>=9){d.state="leave";d.t=0;}}
    else{d.alpha-=dt/.9;if(d.alpha<=0){S.tables[d.table]=false;d.dead=true;}}
  });
  S.dine=S.dine.filter(d=>!d.dead);
  S.pops.forEach(p=>p.t+=dt);S.pops=S.pops.filter(p=>p.t<1.3);
  S.st.forEach(st=>{
    if(st.state==="cooking"){
      st.t+=dt;
      if(st.t>=st.time){st.state="done";st.age=0;dirty=true;sfx.done();}
    }else if(st.state==="done"){
      st.age+=dt;
      if(st.type!=="frz"&&st.age>=burnAfter()){st.state="burnt";dirty=true;sfx.burn();say("Przypaliło się! 🔥");}
    }
  });
  if(S.guide)guideTick();
  if(S.time<=0&&S.q.length===0)endDay();
}

    const k=p.t/1.3;g.save();g.globalAlpha=1-k*k;g.font=`bold ${U*1.2}px system-ui,sans-serif,${EF}`;g.textAlign="center";
    g.lineWidth=3;g.strokeStyle="rgba(40,20,10,.85)";g.fillStyle=p.col;
    const y=CT-U*1.6-k*U*2.2;g.strokeText(p.txt,p.x,y);g.fillText(p.txt,p.x,y);g.restore();
  });
}

function render(){
  dirty=false;
  $("sndBtn").textContent=S.sound?"🔊":"🔇";
  $("musBtn").style.opacity=S.music?1:.4;
  const F=focusInfo();
  const need=new Set(S.hints&&F&&!F.free?F.chips.filter(x=>!x.done).map(x=>x.id):[]);
  if(F&&F.free&&S.hints)need.add(F.o.need);
  // automatycznie otwórz zakładkę spiżarni z następnym potrzebnym składnikiem
  const nxt=F&&!F.free?F.chips.find(x=>!x.done):null;
  const nsig=nxt?F.r.id+"|"+nxt.id+"|"+F.st.items.length:"";
  if(nsig!==S.needSig){S.needSig=nsig;if(nxt&&S.hints)S.tab=ING[nxt.id].c;}
  // karta przepisu
  let rc="";
  if(!F){
    rc=`<div class="rc-head"><span class="rc-e">🚪</span><div><b>Czekamy na klientów…</b><small>Gdy ktoś wejdzie, tu pojawi się przepis krok po kroku</small></div></div>`;
  }else if(F.free){
    const nd=ING[F.o.need];
    let hint="👆 Weź "+nd.e+" "+nd.n+", dorzuć dowolny składnik do jednego urządzenia i dotknij jego przycisku (Gotuj, Smaż, Piecz, Grzej lub Mroź)";
    if(S.hand&&S.hand.t==="dish")hint=orderMatches(F.o,S.hand.dish)?"🍽️ Pasuje! Dotknij tego klienta":"🍽️ Dotknij klienta z zieloną ramką";
    const al=F.o.avoid?AL[F.o.avoid]:null;
    if(al&&!(S.hand&&S.hand.t==="dish"))hint="🚫 Gość uczulony na "+al.n+" "+al.e+"! Nie dawaj składników z tym alergenem. "+hint;
    rc=`<div class="rc-head"><span class="rc-e">🍽️</span><div><b>Danie szefa kuchni${al?" (alergia: "+al.n+")":""}</b><small>Wymyśl własne danie z ${nd.e} ${nd.n} · dowolne urządzenie · min. 2 składniki</small></div><span class="rc-st">+5 zł</span></div>
      <div class="rc-row"><div class="chip ${S.hand&&S.hand.t==="ing"&&S.hand.id===F.o.need?"held":""}" data-act="ing" data-id="${F.o.need}">${nd.e}<i>${S.stock[F.o.need]||0}</i></div><span class="rc-plus">+</span><div class="chip" style="cursor:default">❓</div><span class="rc-arrow">➜</span><span class="rc-dish">🍽️</span></div>
      <div class="rc-hint">${hint}</div>`;
  }else{
    const r=F.r,sn=STN[F.stIdx];
    let hint="";
    if(S.hand&&S.hand.t==="dish")hint="🍽️ Dotknij klienta z zieloną ramką";
    else if(F.st.state==="done"&&F.st.dish&&F.st.dish.rid===r.id)hint="✋ Gotowe! Dotknij: "+sn.name+" (szybko = idealne ⭐)";
    else if(F.st.state==="cooking"&&F.st.dish&&F.st.dish.rid===r.id)hint="⏳ "+sn.doing+"… zajmij się następnym zamówieniem";
    else if(F.st.state==="burnt")hint="🔥 Przypalone! Dotknij: "+sn.name+", żeby wyrzucić";
    else if(F.st.state!=="idle")hint="⏳ "+sn.name+" jest zajęta — poczekaj albo ✖";
    else if(S.hand&&S.hand.t==="ing")hint=need.has(S.hand.id)?"👉 Wrzuć do: "+sn.e+" "+sn.name:(S.hints?"❌ Tego składnika nie potrzeba — odłóż 🗑️":"👉 Wrzuć do: "+sn.e+" "+sn.name);
    else if(S.hints){const nx=F.chips.find(x=>!x.done);if(nx){const cat=CATS.find(c=>c[0]===ING[nx.id].c);hint="👆 Chwyć "+ING[nx.id].e+" "+ING[nx.id].n+" (zakładka "+cat[1]+" "+cat[2]+") i wrzuć do: "+sn.e+" "+sn.name;}
      else if(F.st.state==="idle")hint="▶ Dotknij „"+STN[F.stIdx].btn.slice(2)+"” w urządzeniu";}
    else hint="📖 Sprawdź przepis w książce kucharskiej";
    {const nD=F.chips.filter(x=>x.done).length,tot=F.chips.length+2;let cur=nD;
      if(F.st.state==="cooking"||F.st.state==="done")cur=F.chips.length;
      if(S.hand&&S.hand.t==="dish")cur=F.chips.length+1;
      hint="KROK "+(cur+1)+" z "+tot+" · "+hint;}
    rc=`<div class="rc-head"><span class="rc-e">${r.e}</span><div><b>${r.name}</b><small>${r.price} zł · ⏱ ${r.time} s</small></div><span class="rc-st">${sn.e} ${sn.name}</span></div>`+
      (S.hints?`<div class="rc-row">${F.chips.map((x,i)=>{const stk=S.stock[x.id]||0,held=S.hand&&S.hand.t==="ing"&&S.hand.id===x.id&&!x.done;
        return (i?`<span class="rc-plus">+</span>`:"")+`<div class="chip ${x.done?"done":""} ${held?"held":""}" ${x.done?"":`data-act="ing" data-id="${x.id}"`}>${ING[x.id].e}<i>${x.done?"✓":stk}</i></div>`;}).join("")}
        <span class="rc-arrow">➜</span><span class="rc-dish">${r.e}</span></div>`:"")+
      `<div class="rc-hint">${hint}</div>`;
  }
  if(S.guide)rc=guideHTML();
  $("recipe").innerHTML=rc;
  // urządzenia
  $("stat").innerHTML=activeStations().map(i=>{
    const st=S.st[i],def=STN[i];
    let msg="Wrzuć składniki",big=def.e;
    if(st.state==="cooking")msg=def.doing+"… "+Math.max(1,Math.ceil(st.time-st.t))+" s";
    if(st.state==="done"){big=st.dish.e;msg="Gotowe! Odbierz ✋";}
    if(st.state==="burnt"){big="🔥";msg="Przypalone! Dotknij";}
    const slots=st.items.map(x=>ING[x].e).join("")||"·";
    const m=st.state==="idle"&&st.items.length>=2;
    const tgt=F&&!F.free&&F.stIdx===i&&st.state!=="cooking"?"target":"";
    const dim=F&&!F.free&&F.stIdx!==i&&st.state==="idle"&&!st.items.length?"dim":"";
    return `<div class="st ${def.cls} ${st.state} ${tgt} ${dim}" data-act="station" data-i="${i}">

      <div class="slots">${slots}</div>
      <div class="bar"><i id="sb${i}" style="background:${def.type==="frz"?"#3aa3ff":"#ff7a2f"}"></i></div>
      ${m?`<button class="go" data-act="cook" data-i="${i}">${def.btn}</button>`:`<div class="msg" id="sm${i}">${msg}</div>`}</div>`;
  }).join("");
  // ręka
  let h="✋ W ręku: nic";
  if(S.hand){
    if(S.hand.t==="ing"){const x=ING[S.hand.id];h=`✋ <span class="he">${x.e}</span> ${x.n}`;}
    else h=`✋ <span class="he">${S.hand.dish.e}</span> ${S.hand.dish.name} · ${S.hand.q.l}`;
  }
  $("hand").innerHTML=h;
  $("wash").classList.toggle("dirty",!!(hyg()&&S.dirty));$("wash").style.display=(hyg()&&S.dirty)?"":"none";
  // spiżarnia
  const used=usedIng();
  const cats=CATS.filter(c=>[...used].some(i=>ING[i].c===c[0]));
  if(!cats.some(c=>c[0]===S.tab))S.tab=cats[0][0];
  $("tabs").innerHTML=cats.map(([k,ic,n])=>`<button class="tab ${S.tab===k?"on":""}" data-act="tab" data-id="${k}"><span class="ti">${ic}</span><span class="tl"> ${n}</span>${[...need].some(id=>ING[id].c===k)?`<span class="dot"></span>`:""}</button>`).join("");
  $("tray").innerHTML=Object.keys(ING).filter(id=>ING[id].c===S.tab&&used.has(id)).sort((a,b)=>(need.has(b)?1:0)-(need.has(a)?1:0)).map(id=>{
    const x=ING[id],n=S.stock[id]||0,held=S.hand&&S.hand.t==="ing"&&S.hand.id===id;
    return `<div class="tile ${held?"held":""} ${n?"":"out"} ${need.has(id)&&!held?"need":""} ${need.size&&!need.has(id)&&!held?"dimmed":""}" data-act="ing" data-id="${id}">

      <div class="te">${x.e}</div><div class="tn">${n?x.n:"Kup "+x.p+" zł"}</div></div>`;
  }).join("");
  updateBars();
}

}function updateBars(){
  const b0=burnAfter();
  S.st.forEach((st,i)=>{
    const b=$("sb"+i);if(!b)return;
    let f=0,col=null;
    if(st.state==="cooking")f=st.t/st.time;
    else if(st.state==="done"){
      if(st.type==="frz")f=1;
      else{f=1-st.age/b0;col=st.age<=b0*.35?"#3cb371":st.age<=b0*.75?"#f5a623":"#e5484d";}
    }
    b.style.width=(f*100)+"%";if(col)b.style.background=col;
    if(st.state==="cooking"){const sm=$("sm"+i);if(sm)sm.textContent=STN[i].doing+"… "+Math.max(1,Math.ceil(st.time-st.t))+" s";}
  });
  $("time").textContent="⏱ "+Math.max(0,Math.ceil(S.time))+"s";
  $("coins").textContent="💰 "+S.coins+" zł";
  $("rep").textContent="★ "+S.rep.toFixed(1);
  $("day").textContent="Poziom "+S.day+" · "+CHAPTERS[Math.min(4,Math.floor((S.day-1)/10))];$("title").textContent=titleOf();
  const cb=$("combo");cb.style.display=S.combo>=2?"inline-block":"none";cb.textContent="🔥 x"+S.combo;
  const stress=S.q.some(c=>c.p/c.max<.25),happy=S.pops.some(p=>p.txt.startsWith("+")&&p.t<1);
  $("mood").textContent=stress?"😰":happy?"😄":"😊";
  const tg=target();
  $("goalTxt").textContent="Cel: "+S.earned+" / "+tg+" zł";
  const M=S.mission;$("mission").textContent=M?(M.done?"🎯 Zadanie wykonane! ✅":"🎯 "+M.text+" "+M.have+"/"+M.need+" (+"+M.reward+" zł)"):"";
  $("goalBar").style.width=Math.min(100,S.earned/tg*100)+"%";
}

document.addEventListener("pointerdown",e=>{
  S.idle=0;hideHandHint();
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.dataset.act==="tnext"){e.preventDefault();if(S.tutStep>=TUT.length-1)endTutorial();else{S.tutStep++;showCoach();}return;}
  if(el.dataset.act==="tskip"){e.preventDefault();endTutorial();return;}
  if(el.dataset.act==="help"){e.preventDefault();showHow();return;}
  if(el.dataset.act==="how"){e.preventDefault();showHow();return;}
  if(el.dataset.act==="closehow"){e.preventDefault();if(menuMode){menu();}else{closeOv();S.running=!!S._wasRunning;}return;}
  if(el.dataset.act==="showwhere"){e.preventDefault();closeOv();S.running=!!S._wasRunning;startTutorial();return;}
  if(el.dataset.act==="gnext"){e.preventDefault();if(S.guide){if(S.guide.step>=GSTEPS.length-1)guideEnd();else{S.guide.step++;dirty=true;}}return;}
  if(el.dataset.act==="gskip"){e.preventDefault();guideEnd();return;}
  if(el.dataset.act==="easy"){e.preventDefault();S.easy=!S.easy;save();menu();return;}
  e.preventDefault();
  const a=el.dataset.act;
  // przeciąganie: składnik z kafelka/karty -> urządzenie, gotowe danie z urządzenia -> klient
  if(S.running&&a==="ing"){
    DR={kind:"ing",id:el.dataset.id,x0:e.clientX,y0:e.clientY,pid:e.pointerId,touch:e.pointerType==="touch",started:false,armed:e.pointerType!=="touch"};
    if(DR.touch)DR.timer=setTimeout(()=>{if(DR){DR.armed=true;haptic(12);}},160);
    return;
  }
  if(S.running&&a==="station"){
    const sti=S.st[+el.dataset.i];
    if(sti&&sti.state==="done"&&!S.hand){
      DR={kind:"dish",i:+el.dataset.i,x0:e.clientX,y0:e.clientY,pid:e.pointerId,touch:e.pointerType==="touch",started:false,armed:e.pointerType!=="touch"};
      if(DR.touch)DR.timer=setTimeout(()=>{if(DR){DR.armed=true;haptic(12);}},160);
      return;
    }
  }
  if(a==="scene"){if(S.running)sceneTap(e);return;}
  if(a==="startday"){menuMode=false;endData=null;closeOv();newDay();render();beep(660,.12,"triangle");musicStart();
    if(!S.tutDone)guideStart();return;}
  if(a==="hints"){S.hints=!S.hints;save();menu();return;}
  if(a==="learn"){S.learn=!S.learn;save();menu();return;}
  if(a==="menu"){menu();return;}
  if(a==="school"){showSchool();return;}
  if(a==="map"){showMap();return;}
  if(a==="playlv"){S.day=Math.min(50,Math.max(1,+el.dataset.i));endData=null;menuMode=false;closeOv();newDay();render();musicStart();if(!S.tutDone)guideStart();return;}
  if(a==="lesson"){S.lesson={id:el.dataset.id,step:0,score:0,pick:null};lessonView();return;}
  if(a==="lprev"){S.lesson.step=Math.max(0,S.lesson.step-1);lessonView();return;}
  if(a==="lnext"){const st=S.lesson,L=LESSONS.find(x=>x.id===st.id);
    if(st.step>=L.cards.length&&st.pick===null)return;
    st.pick=null;st.step++;lessonView();return;}
  if(a==="lans"){const st=S.lesson,L=LESSONS.find(x=>x.id===st.id),qi=st.step-L.cards.length;
    if(st.pick!==null||qi<0||qi>=L.q.length)return;
    st.pick=+el.dataset.i;if(st.pick===L.q[qi].c){st.score++;sfx.coin();}else sfx.bad();lessonView();return;}
  if(a==="qans"){const Z=S.quiz;if(!Z||Z.done)return;Z.pick=+el.dataset.i;Z.done=true;S.quizTot++;
    if(Z.pick===Z.q.c){S.quizOK++;S.coins+=15;sfx.coin();}else sfx.bad();save();renderQuiz();return;}
  if(a==="qnext"){showEnd();return;}
  if(a==="booktab"){S.bookTab=el.dataset.id;overlay(bookHTML());return;}
  if(a==="upgrade"){
    const u=UPS.find(x=>x.id===el.dataset.id);
    if(S.up[u.id]>=3||S.coins<upCost(u)){sfx.bad();return;}
    S.coins-=upCost(u);S.up[u.id]++;save();sfx.coin();
    if(endData)showEnd();
    return;
  }
  if(a==="closebook"){
    if(menuMode){menu();return;}
    closeOv();S.running=!!S._wasRunning;return;
  }
  if(a==="book"&&menuMode){S.running=false;overlay(bookHTML());return;}
  act(el.dataset);
});
/* ---------- efekty: monety, konfetti, wstrząsy, loty ---------- */
function shake(){const a=document.getElementById("app");if(!a)return;a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake");}
function flyEmoji(x0,y0,x1,y1,txt,dur){
  const el=document.createElement("div");el.className="fly";el.textContent=txt;document.body.appendChild(el);
  const a=el.animate([{transform:`translate(${x0-15}px,${y0-15}px) scale(.8) rotate(-10deg)`,opacity:1},
    {transform:`translate(${(x0+x1)/2-15}px,${Math.min(y0,y1)-40}px) scale(1.25) rotate(8deg)`,opacity:1,offset:.5},
    {transform:`translate(${x1-15}px,${y1-15}px) scale(.7) rotate(0)`,opacity:.9}],{duration:dur||520,easing:"cubic-bezier(.3,.5,.4,1)"});
  a.onfinish=()=>el.remove();
}
function coinBurst(x,y,n){
  const hud=document.getElementById("coins").getBoundingClientRect(),tx=hud.left+hud.width*.3,ty=hud.top+hud.height/2;
  for(let i=0;i<n;i++)setTimeout(()=>{
    const el=document.createElement("div");el.className="coinfx";document.body.appendChild(el);
    const dx=(Math.random()-.5)*60,dy=-20-Math.random()*40;
    const a=el.animate([{transform:`translate(${x}px,${y}px) scale(.6)`},
      {transform:`translate(${x+dx}px,${y+dy}px) scale(1.1)`,offset:.3},
      {transform:`translate(${tx}px,${ty}px) scale(.6)`,opacity:.9}],{duration:650+Math.random()*250,easing:"cubic-bezier(.4,0,.6,1)"});
    a.onfinish=()=>el.remove();
  },i*50);
}
function confetti(){
  const cols=["#ffd25e","#ff7a2f","#3cb371","#4aa8ff","#e5484d","#c678dd"];
  for(let i=0;i<70;i++){
    const el=document.createElement("div");el.className="cf";el.style.left=Math.random()*100+"vw";el.style.background=cols[i%cols.length];
    document.body.appendChild(el);
    const a=el.animate([{transform:"translateY(0) rotate(0)",opacity:1},{transform:`translate(${(Math.random()-.5)*160}px,${innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:.9}],
      {duration:1800+Math.random()*1400,delay:Math.random()*500,easing:"ease-in"});
    a.onfinish=()=>el.remove();
  }
}
function custScreen(c){const r=cv.getBoundingClientRect();return [r.left+c.x,r.top+CT-U*3];}
function placeFx(id,i,def){
  if(window.__noFly)return;
  const st=document.querySelector(`[data-act=station][data-i="${i}"]`);if(!st)return;
  const src=document.querySelector(`#tray [data-act=ing][data-id="${id}"]`)||document.getElementById("hand");
  const a=center(src),b=center(st);
  flyEmoji(a[0],a[1],b[0],b[1]-10,ING[id].e,420);
  if(def.type==="pan"||def.type==="oven"||def.type==="pot")sfx.sizzle();
}
function rewardFx(c,d,q,pay){
  const [x,y]=custScreen(c);
  coinBurst(x,y,Math.min(10,3+Math.round(pay/6)));
  const h=document.getElementById("hand");
  if(h&&!window.__noFly){const a=center(h);flyEmoji(a[0],a[1],x,y+10,d.e,420);}
  // zadanie dnia
  const M=S.mission;
  if(M&&!M.done){
    if(M.k==="count"&&d.st===M.st)M.have++;
    else if(M.k==="ideal"&&q.k===3)M.have++;
    else if(M.k==="vip"&&c.type==="vip")M.have++;
    else if(M.k==="serve")M.have++;
    if(M.have>=M.need){M.done=true;S.coins+=M.reward;S.earned+=M.reward;
      say("🎯 Zadanie wykonane! +"+M.reward+" zł");sfx.tada();coinBurst(x,y,14);}
  }
}
/* zdarzenia w trakcie poziomu */
function eventTick(dt){
  if(S.day<3||S.time<=0)return;
  if(S.event){
    S.event.left-=dt;
    if(S.event.left<=0){S.event=null;S.evtT=45+Math.random()*30;document.getElementById("evt").classList.remove("on");}
    else{const e=document.getElementById("evt");e.textContent=S.event.txt+" · "+Math.ceil(S.event.left)+" s";}
  }else{
    S.evtT-=dt;
    if(S.evtT<=0){
      const rush=Math.random()<.5;
      S.event=rush?{type:"rush",txt:"🔔 GODZINA SZCZYTU: goście przychodzą szybciej!",left:22}:{type:"happy",txt:"🎉 HAPPY HOUR: napiwki i zarobek x1,5!",left:22};
      const e=document.getElementById("evt");e.textContent=S.event.txt;e.classList.add("on");sfx.door();
    }
  }
}
function pickMission(){
  const opts=[{k:"serve",need:5+Math.floor(S.day/6),text:"Obsłuż klientów"},{k:"ideal",need:2+Math.floor(S.day/10),text:"Wydaj idealne dania ⭐"}];
  const sts=[...new Set(unlocked().map(r=>r.st))];
  if(sts.includes("frz"))opts.push({k:"count",st:"frz",need:2+Math.floor(S.day/12),text:"Podaj desery z zamrażarki ❄️"});
  if(sts.includes("pot"))opts.push({k:"count",st:"pot",need:2+Math.floor(S.day/12),text:"Podaj dania z garnka 🍲"});
  if(S.day>=5)opts.push({k:"vip",need:1,text:"Obsłuż klienta VIP 👑"});
  const m=rnd(opts);return Object.assign({have:0,done:false,reward:25+S.day*2},m);
}
/* ---------- poradnik: pierwsze zamówienie krok po kroku ---------- */
const panIdx=()=>STN.findIndex(s=>s.type==="pan");
const GSTEPS=[
 {e:"👀",t:"Klient chce OMLET 🍳. Zamówienie jest nad jego głową.",btn:"Dalej ▶"},
 {e:"🥚",t:"Chwyć JAJKO i przeciągnij na PATELNIĘ",wait:()=>S.st[panIdx()].items.length>=1},
 {e:"🥚",t:"Jeszcze jedno JAJKO!",wait:()=>S.st[panIdx()].items.length>=2},
 {e:"🧀",t:"Teraz SER!",wait:()=>S.st[panIdx()].items.length>=3},
 {e:"🍳",t:"Smaży się… poczekaj kilka sekund",wait:()=>S.st[panIdx()].state==="done"},
 {e:"✋",t:"Gotowe! Przeciągnij omlet do klienta",wait:()=>S.served>=1},
 {e:"🎉",t:"Brawo! Pierwsza zapłata! Teraz grasz sama.",btn:"Zaczynamy ▶"}
];
function howStrip(){
  const s=[["👀","Zobacz zamówienie"],["🥚","Chwyć składnik"],["🍳","Wrzuć do urządzenia"],["🍽️","Podaj klientowi"],["💰","Zapłata!"]];
  return `<div class="how">`+s.map((x,i)=>(i?`<span class="ar">➜</span>`:"")+`<div class="hs"><i>${i+1}</i><b>${x[0]}</b><small>${x[1]}</small></div>`).join("")+`</div>`;
}
function showHow(){
  S._wasRunning=S.running;S.running=false;
  overlay(`<h2>❓ Jak grać?</h2>${howStrip()}
    <div class="howtips"><div>⏱ Klient czeka do 3 minut. Patrz na licznik nad jego głową.</div><div>⭐ Wyjmij danie szybko = idealne i więcej pieniędzy.</div><div>🎯 Zrób zadanie dnia, a dostaniesz premię.</div></div>
    <button class="bigbtn" data-act="closehow">${menuMode?"Wróć do menu":"Wróć do gry ▶"}</button>
    ${menuMode?"":`<button class="bigbtn alt" data-act="showwhere">📍 Pokaż, gdzie co jest</button>`}`);
}
function guideStart(){
  if(S.day!==1){S.tutDone=true;save();return;}
  S.guide={step:0};
  S.q=[];S.dine=[];S.tables=[];
  const c=makeCust();c.orders=[{k:"rec",rid:"omlet",got:false}];c.allergy=null;c.type="normal";c.p=c.max=300;c.x=slotX(0);c.walk=false;
  S.q.push(c);S.focusC=c;S.spawn=99999;S.tab="dairy";S.mission=null;
  S.stock.jajko=Math.max(S.stock.jajko||0,3);S.stock.ser=Math.max(S.stock.ser||0,3);
  S.running=true;dirty=true;
}
function guideHTML(){
  const st=GSTEPS[S.guide.step];
  return `<div class="rc-head"><span class="rc-e" style="font-size:34px">${st.e}</span><div><b style="font-size:15px">${st.t}</b><small>Poradnik · krok ${S.guide.step+1} z ${GSTEPS.length}</small></div></div>`+
    (st.btn?`<button class="gbtn" data-act="gnext">${st.btn}</button>`:`<div class="rc-hint">👆 Zrób to, a pójdziemy dalej</div>`)+
    `<button class="gskip" data-act="gskip">Pomiń poradnik</button>`;
}
function guideEnd(){
  if(!S.guide)return;
  S.guide=null;S.tutDone=true;save();S.spawn=2;
  const c=S.q[0];if(c){c.p=c.max=maxPat();}
  S.mission=pickMission();dirty=true;sfx.tada();
}
function guideTick(){
  const G=S.guide;if(!G)return;
  const st=GSTEPS[G.step];if(!st.wait)return;
  const pan=S.st[panIdx()];
  if(G.step>=1&&G.step<=3){ // zły składnik? cofnij
    const n=k=>pan.items.filter(x=>x===k).length;
    if(pan.items.some(x=>x!=="jajko"&&x!=="ser")||n("jajko")>2||n("ser")>1){
      pan.items.forEach(i=>S.stock[i]=(S.stock[i]||0)+1);resetSt(pan);G.step=1;dirty=true;say("Ups, to nie to! Zaczynamy od jajka 🥚");sfx.bad();return;
    }
  }
  if(st.wait()){G.step++;dirty=true;sfx.put();}
}
/* ---------- poradnik: gdzie co jest ---------- */
const TUT=[
 {t:"Witaj, szefowo kuchni! 👩‍🍳 To jest RESTAURACJA. Klienci przychodzą do lady i czekają. Nad głową każdego widzisz, czego chce (obrazek dania i składniki).",el:"#cust"},
 {t:"To jest KARTA PRZEPISU. Mówi, co ugotować, z czego i w jakim urządzeniu. Podpowiedź pod spodem prowadzi Cię krok po kroku.",el:"#recipe"},
 {t:"To jest SPIŻARNIA. Złap składnik i PRZECIĄGNIJ go do urządzenia (albo tylko go dotknij). Złote ramki pokazują, co jest potrzebne.",el:"#tray"},
 {t:"To jest KUCHNIA: garnek, patelnia, piekarnik, mikrofalówka i zamrażarka. Wrzuć tu składniki. Podświetlone urządzenie jest właściwe.",el:"#stat"},
 {t:"Gdy danie jest gotowe, PRZECIĄGNIJ je do klienta przy ladzie (albo dotknij danie, a potem klienta). Zdążysz na czas, to zapłacą! Powodzenia! 🍀",el:"#cust"}
];
function coachClear(){document.querySelectorAll(".coach").forEach(n=>n.classList.remove("coach"));$("coach").classList.remove("on");}
function showCoach(){
  coachClear();
  const st=TUT[S.tutStep],el=document.querySelector(st.el);
  if(el)el.classList.add("coach");
  const c=$("coach"),r=el?el.getBoundingClientRect():{top:0,height:0};
  const mid=r.top+r.height/2,low=mid>innerHeight*.5;
  c.style.top=low?"58px":"auto";c.style.bottom=low?"auto":"12px";
  const last=S.tutStep===TUT.length-1;

  c.classList.add("on");

function startTutorial(){S.tutResume=S.running;S.running=false;S.tutStep=0;closeOv();showCoach();}
function endTutorial(){coachClear();S.tutDone=true;save();S.running=S.tutResume;S.tutResume=false;dirty=true;beep(660,.12,"triangle");}
/* animowana ręka: pokazuje, co dokąd przeciągnąć, gdy gracz długo nic nie robi */
let HH={anim:null,sig:""};
function hideHandHint(){const h=$("hhand");if(h)h.style.display="none";if(HH.anim){HH.anim.cancel();HH.anim=null;}HH.sig="";}
function center(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
function handHintTarget(){
  const F=focusInfo();if(!F||F.free||S.hand&&S.hand.t==="dish")return null;
  if(F.st.state==="done"&&F.st.dish&&F.st.dish.rid===F.r.id&&!S.hand){
    const from=document.querySelector(`[data-act=station][data-i="${F.stIdx}"]`);
    const r=cv.getBoundingClientRect();
    if(!from)return null;
    return {sig:"dish"+F.stIdx,a:center(from),b:[r.left+F.c.x,r.top+CT-U*2]};
  }
  if(F.st.state!=="idle")return null;
  const nx=F.chips.find(x=>!x.done);if(!nx)return null;
  const to=document.querySelector(`[data-act=station][data-i="${F.stIdx}"]`);if(!to)return null;
  let from=null;
  if(S.hand&&S.hand.t==="ing"){if(S.hand.id!==nx.id)return null;from=$("hand");}
  else from=document.querySelector(`#tray [data-act=ing][data-id="${nx.id}"]`)||document.querySelector(`#recipe [data-act=ing][data-id="${nx.id}"]`);
  if(!from)return null;
  return {sig:"ing"+nx.id+F.stIdx+(S.hand?"h":""),a:center(from),b:center(to)};
}
function updateHandHint(){
  if(!S.running||S.idle<(S.guide?.3:6)||dirtyNow()){hideHandHint();return;}
  const t=handHintTarget();
  if(!t){hideHandHint();return;}
  if(HH.sig===t.sig&&HH.anim)return;
  hideHandHint();
  let h=$("hhand");if(!h){h=document.createElement("div");h.id="hhand";h.textContent="👆";document.body.appendChild(h);}
  h.style.display="block";HH.sig=t.sig;
  HH.anim=h.animate([
    {transform:`translate(${t.a[0]-12}px,${t.a[1]-8}px) scale(1)`,opacity:0},
    {transform:`translate(${t.a[0]-12}px,${t.a[1]-8}px) scale(1.15)`,opacity:1,offset:.15},
    {transform:`translate(${t.b[0]-12}px,${t.b[1]-8}px) scale(1.15)`,opacity:1,offset:.8},
    {transform:`translate(${t.b[0]-12}px,${t.b[1]-8}px) scale(1)`,opacity:0}
  ],{duration:1900,iterations:Infinity,easing:"ease-in-out"});
}
const dirtyNow=()=>!!DR;
/* ---------- przeciąganie ---------- */
let DR=null;
function ghostShow(txt){let g=document.getElementById("ghost");if(!g){g=document.createElement("div");g.id="ghost";document.body.appendChild(g);}g.textContent=txt;g.style.display="block";document.body.classList.add("dragging");return g;}
function ghostHide(){const g=document.getElementById("ghost");if(g)g.style.display="none";document.body.classList.remove("dragging");document.querySelectorAll(".st.drop").forEach(n=>n.classList.remove("drop"));}
function dragCancel(){if(DR&&DR.timer)clearTimeout(DR.timer);DR=null;ghostHide();}
document.addEventListener("pointermove",e=>{
  if(!DR||e.pointerId!==DR.pid)return;
  const dx=e.clientX-DR.x0,dy=e.clientY-DR.y0,dist=Math.hypot(dx,dy);
  if(!DR.started){
    if(!DR.armed){if(dist>10){clearTimeout(DR.timer);DR=null;}return;}
    if(dist<8)return;
    DR.started=true;
    let em="❓";
    if(DR.kind==="ing")em=ING[DR.id].e;
    else{const st=S.st[DR.i];em=st&&st.dish?st.dish.e:"🍽️";}
    ghostShow(em);sfx.take();
    if(DR.kind==="ing"&&!S.dragTip){S.dragTip=true;}
  }
  const g=document.getElementById("ghost");g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";
  document.querySelectorAll(".st.drop").forEach(n=>n.classList.remove("drop"));
  const t=document.elementFromPoint(e.clientX,e.clientY),stEl=t&&t.closest&&t.closest("[data-act=station]");
  if(stEl&&DR.kind==="ing")stEl.classList.add("drop");
},{passive:true});
document.addEventListener("pointerup",e=>{
  if(!DR||e.pointerId!==DR.pid)return;
  const d=DR;clearTimeout(d.timer);DR=null;
  if(!d.started){ // zwykłe dotknięcie
    if(d.kind==="ing")act({act:"ing",id:d.id});else act({act:"station",i:d.i});
    return;
  }
  ghostHide();
  const t=document.elementFromPoint(e.clientX,e.clientY);
  if(d.kind==="ing"){
    const stEl=t&&t.closest("[data-act=station]"),bin=t&&t.closest("#bin");
    if(stEl){
      const i=+stEl.dataset.i;
      if(!(S.hand&&S.hand.t==="ing"&&S.hand.id===d.id))act({act:"ing",id:d.id});
      if(S.hand&&S.hand.t==="ing"&&S.hand.id===d.id){
        window.__noFly=true;stationTap(i);window.__noFly=false;
        if(S.hand&&S.hand.t==="ing"){act({act:"bin"});} // urządzenie nie przyjęło – odłóż
      }
    }else if(bin&&S.hand&&S.hand.t==="ing")act({act:"bin"});
  }else{
    if(t&&t.id==="scene"){
      const r=cv.getBoundingClientRect(),x=e.clientX-r.left;
      let best=-1,bd=1e9;S.q.forEach((c,k)=>{const dd=Math.abs(c.x-x);if(dd<SW*.6&&dd<bd){bd=dd;best=k;}});
      act({act:"station",i:d.i});
      if(S.hand&&S.hand.t==="dish"){if(best>=0)custTap(best);else say("Upuść danie na kliencie przy ladzie");}
    }
  }
});
document.addEventListener("pointercancel",e=>{if(DR&&e.pointerId===DR.pid)dragCancel();});
document.addEventListener("touchmove",e=>{if(DR&&DR.started)e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("resize",resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe($("cust"));
let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  tick(dt);
  if(S.running)S.idle+=dt;
  if(dirty)render();else updateBars();
  updateHandHint();
  draw();
  requestAnimationFrame(loop);
}
load();S.st=STN.map(s=>freshStation(s.type));
usedIng().forEach(i=>{S.stock[i]=3;});
render();resize();menu();requestAnimationFrame(loop);
</script>
